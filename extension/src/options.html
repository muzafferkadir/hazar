<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <title>Hazar</title>
    <link rel="stylesheet" href="theme.css" />
    <style>
      body {
        margin: 0;
        padding: 16px 18px 24px;
        width: 420px;
        background: var(--bg);
        color: var(--text);
        font: 12px/1.6 -apple-system, BlinkMacSystemFont, "SF Pro Text", Helvetica, sans-serif;
      }
      h1 { display:flex; align-items:center; gap:8px; font-size: 14px; margin: 0 0 12px; }
      label { display: block; margin-top: 12px; color: var(--dim); }
      input[type="text"], input[type="number"], textarea {
        width: 100%;
        margin-top: 4px;
        padding: 6px 8px;
        background: var(--card);
        color: inherit;
        font: inherit;
        border: 1px solid var(--line);
        border-radius: 6px;
      }
      textarea { min-height: 74px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
      .row { display: flex; align-items: center; gap: 8px; margin-top: 12px; }
      footer { display: flex; align-items: center; justify-content: space-between; margin-top: 18px; }
      button {
        font: inherit;
        padding: 6px 12px;
        color: var(--accent-contrast);
        background: var(--accent);
        font-weight: 600;
        border: 0;
        border-radius: 6px;
        cursor: pointer;
      }
      button:hover { background: var(--accent-hover); }
      input[type="checkbox"] { accent-color: var(--accent); }
      .hint { color: var(--dim); margin-top: 4px; }
      #saved { color: var(--success); opacity: 0; transition: opacity 0.2s; }
    </style>
  </head>
  <body>
    <h1><img src="../icons/32x32.png" width="24" height="24" alt="" /> Hazar</h1>

    <div class="row"><input type="checkbox" id="capture_enabled" /><label for="capture_enabled" style="margin: 0" data-i18n="optCapture"></label></div>
    <div class="row"><input type="checkbox" id="capture_manifests" /><label for="capture_manifests" style="margin: 0" data-i18n="optManifests"></label></div>
    <div class="row"><input type="checkbox" id="group_hls" /><label for="group_hls" style="margin: 0" data-i18n="optGroupHls"></label></div>

    <label for="min_size_mb" data-i18n="optMinSize"></label>
    <input type="number" id="min_size_mb" min="0" step="0.5" />

    <label for="ports" data-i18n="optPorts"></label>
    <input type="text" id="ports" />
    <div class="hint" data-i18n="optPortsHint"></div>

    <label for="excluded_hosts" data-i18n="optExcluded"></label>
    <textarea id="excluded_hosts"></textarea>

    <label for="deny_patterns" data-i18n="optDeny"></label>
    <textarea id="deny_patterns"></textarea>

    <details style="margin-top:16px">
      <summary data-i18n="optYtdlp"></summary>
      <label for="ytdlp_proxy" data-i18n="optProxy"></label><input type="text" id="ytdlp_proxy" placeholder="http://127.0.0.1:8080" />
      <div class="hint" data-i18n="optProxyHint"></div>
      <label for="ytdlp_source_address" data-i18n="optSource"></label><input type="text" id="ytdlp_source_address" />
      <label for="ytdlp_impersonate_hosts" data-i18n="optImpersonate"></label><textarea id="ytdlp_impersonate_hosts" placeholder="example.com"></textarea>
    </details>
    <footer>
      <span id="saved" data-i18n="optSaved"></span>
      <button id="save" data-i18n="optSave"></button>
    </footer>

    <script src="locales/en.js"></script>
    <script src="locales/tr.js"></script>
    <script src="i18n.js"></script>
    <script src="options.js"></script>
  </body>
</html>
