<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <title>Hazar Download Manager</title>
    <link rel="stylesheet" href="theme.css" />
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        width: 360px;
        background: var(--bg);
        color: var(--text);
        font: 12px/1.5 -apple-system, BlinkMacSystemFont, "SF Pro Text", Helvetica, sans-serif;
      }
      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        padding: 10px 12px;
        border-bottom: 1px solid var(--line);
      }
      .brand { display: flex; align-items: center; gap: 8px; font-weight: 600; }
      .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--danger); }
      .dot.on { background: var(--success); }
      .dim { color: var(--dim); }
      section { padding: 10px 12px; border-bottom: 1px solid var(--line); }
      h2 {
        margin: 0 0 6px;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: var(--dim);
      }
      .row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        padding: 5px 0;
      }
      .row + .row { border-top: 1px solid var(--line); }
      .row-actions { display: flex; gap: 4px; flex: 0 0 auto; }
      .meta { min-width: 0; }
      .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .kind {
        display: inline-block;
        padding: 0 5px;
        border-radius: 4px;
        background: var(--chip);
        color: var(--chip-text);
        font-size: 10px;
        margin-right: 5px;
      }
      button {
        font: inherit;
        color: var(--text);
        background: var(--control);
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 4px 8px;
        cursor: pointer;
      }
      button:hover:not(:disabled) { background: var(--control-hover); }
      button:active:not(:disabled) { transform: translateY(1px); }
      button.primary { background: var(--accent); border-color: transparent; color: var(--accent-contrast); font-weight: 600; }
      button.primary:hover:not(:disabled) { background: var(--accent-hover); }
      .extractor-error { color: var(--danger); padding: 6px 0; }
      .extractor-error button { margin-top: 6px; }
      .ytdlp .kind { background: var(--accent-soft); color: #fff; font-weight: 600; }
      .ytdlp button.primary { background: transparent; border-color: var(--accent-soft); color: var(--link); }
      .ytdlp button.primary:hover:not(:disabled) { background: var(--chip); }
      button:disabled { opacity: 0.45; cursor: default; }
      .bar { height: 4px; border-radius: 999px; background: var(--line); overflow: hidden; }
      .bar > i { display: block; height: 100%; background: var(--accent-soft); }
      footer { display: flex; justify-content: space-between; padding: 8px 12px; }
      a { color: var(--link); text-decoration: none; }
      .empty { color: var(--dim); padding: 4px 0; }
    </style>
  </head>
  <body>
    <header>
      <div class="brand"><img src="../icons/32x32.png" width="24" height="24" alt="" /> Hazar Download Manager <span class="dot" id="dot"></span></div>
      <div class="dim" id="connection">bağlanıyor…</div>
    </header>

    <section>
      <div class="row">
        <label for="capture">İndirmeleri yakala</label>
        <input type="checkbox" id="capture" />
      </div>
      <div class="row">
        <label for="group">HLS segmentlerini tek dosyada birleştir</label>
        <input type="checkbox" id="group" />
      </div>
    </section>

    <section>
      <h2>Bu sayfadaki medya</h2>
      <div id="candidates"><div class="empty">Aday yok.</div></div>
    </section>

    <section>
      <h2>Son aktarımlar</h2>
      <div id="recent"><div class="empty">Henüz aktarım yok.</div></div>
    </section>

    <footer>
      <button id="reconnect">Yeniden bağlan</button>
      <button id="clear-recent">Listeyi temizle</button>
      <a href="#" id="options">Ayarlar</a>
    </footer>

    <script src="lib.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
